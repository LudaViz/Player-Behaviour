# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # NEW STEP: Create a staging folder and copy ONLY the workshop into it
      - name: Prepare Deployment Folder
        run: |
          mkdir _pages
          cp -r "./Post-Mortem Workshop" ./_pages/

      # NEW STEP: Fix permissions to prevent 403/404 errors during upload
      - name: Fix permissions
        run: chmod -R +rX ./_pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the staging folder, NOT the root repository
          path: './_pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
